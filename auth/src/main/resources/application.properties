# 应用服务 WEB 访问端口
server.port=8081
# 所有接口都加上/api前缀--不推荐
#server.servlet.context-path=/api
# 服务注册
spring.application.name=auth-service
spring.cloud.nacos.discovery.group=DEFAULT_GROUP
spring.cloud.nacos.discovery.namespace=public
spring.cloud.nacos.discovery.server-addr=127.0.0.1:8848
# 自定义starter的测试
count.ip.display=detail

# jwt的配置
jwt.secret=gateway-auth
# 分钟
jwt.access.exp=15
# 天数
jwt.refresh.exp=7

# 数据库配置
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/auth?useUnicode=true&characterEncoding=utf-8&serverTimezone\
  =Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=wuka2012
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5

# security 白名单
whitelist.uri=/v1/auth/**, /v1/public/**
# mybatis-plus配置
#mybatis-plus.config-location=classpath:mapper/**/*.xml

# redis 配置
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.database=0
spring.redis.timeout=10000ms
# redission配置
#redisson.config=classpath:redisson.yaml
